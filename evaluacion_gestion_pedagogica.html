<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evaluación y Gestión Pedagógica — Simulacro</title>
<style>
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}
:root {
  --navy: #1F2A6E;
  --navy-light: #2d3a8a;
  --orange: #E67E22;
  --orange-light: #f5a623;
  --green: #27ae60;
  --green-bg: #eafaf1;
  --red: #c0392b;
  --red-bg: #fdf0ed;
  --bg: #f7f8fc;
  --surface: #ffffff;
  --text: #1a1a2e;
  --text-muted: #5a5a7a;
  --border: #e0e3ef;
  --radius: 10px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: Arial, Helvetica, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.55;
  min-height: 100vh;
}
.header {
  background: var(--navy);
  color: #fff;
  padding: 1.2rem 1rem;
  text-align: center;
  position: sticky; top: 0; z-index: 100;
  box-shadow: 0 2px 8px rgba(31,42,110,.25);
}
.header h1 { font-size: 1.15rem; font-weight: 700; letter-spacing: .02em; }
.header .subtitle { font-size: .82rem; opacity: .85; margin-top: .25rem; }
.scoreboard {
  display: flex; gap: .6rem; justify-content: center;
  flex-wrap: wrap; padding: .6rem 1rem;
  background: var(--surface); border-bottom: 2px solid var(--border);
}
.score-pill {
  font-size: .82rem; padding: .35rem .7rem;
  border-radius: 20px; font-weight: 600;
  display: flex; align-items: center; gap: .3rem;
}
.score-pill.correct { background: var(--green-bg); color: var(--green); }
.score-pill.wrong { background: var(--red-bg); color: var(--red); }
.score-pill.pending { background: #f0f0f5; color: var(--text-muted); }
.score-pill.pct { background: var(--navy); color: #fff; }
.controls {
  display: flex; gap: .5rem; justify-content: center;
  padding: .7rem 1rem; flex-wrap: wrap;
}
.btn {
  font-family: inherit; font-size: .85rem; font-weight: 600;
  padding: .55rem 1.1rem; border: none; border-radius: var(--radius);
  cursor: pointer; min-height: 48px; min-width: 48px;
  transition: transform .15s, box-shadow .15s;
  display: inline-flex; align-items: center; gap: .4rem;
}
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--orange); color: #fff; }
.btn-primary:hover { box-shadow: 0 3px 10px rgba(230,126,34,.35); }
.btn-secondary { background: var(--navy); color: #fff; }
.btn-outline { background: transparent; color: var(--navy); border: 2px solid var(--navy); }
.btn-sm { padding: .4rem .8rem; font-size: .78rem; min-height: 40px; }

.main { max-width: 780px; margin: 0 auto; padding: .8rem; }

/* Mode selector */
.mode-bar {
  display: flex; gap: 0; border-radius: var(--radius);
  overflow: hidden; border: 2px solid var(--navy);
  margin-bottom: 1rem;
}
.mode-btn {
  flex: 1; text-align: center; padding: .6rem;
  font-size: .85rem; font-weight: 600; cursor: pointer;
  background: var(--surface); color: var(--navy);
  border: none; font-family: inherit; min-height: 48px;
  transition: background .2s, color .2s;
}
.mode-btn.active { background: var(--navy); color: #fff; }

/* Situation card */
.situation-card {
  background: var(--surface);
  border-left: 4px solid var(--orange);
  border-radius: var(--radius);
  padding: 1rem 1.1rem;
  margin-bottom: 1rem;
  box-shadow: 0 1px 4px rgba(0,0,0,.06);
}
.situation-card .label {
  font-size: .72rem; font-weight: 700;
  color: var(--orange); text-transform: uppercase;
  letter-spacing: .06em; margin-bottom: .5rem;
}
.situation-card .aspect {
  font-size: .78rem; color: var(--navy); font-weight: 600;
  margin-bottom: .6rem; padding: .4rem .6rem;
  background: #eef0fa; border-radius: 6px;
}
.situation-card p { font-size: .88rem; margin-bottom: .5rem; color: var(--text); }
.sit-toggle {
  font-size: .8rem; color: var(--navy); cursor: pointer;
  font-weight: 600; background: none; border: none;
  font-family: inherit; padding: .3rem 0; min-height: 44px;
}
.sit-body { display: none; }
.sit-body.open { display: block; }

/* Question card */
.q-card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 1rem 1.1rem;
  margin-bottom: .8rem;
  box-shadow: 0 1px 4px rgba(0,0,0,.06);
  border: 2px solid transparent;
  transition: border-color .2s;
}
.q-card.answered-correct { border-color: var(--green); }
.q-card.answered-wrong { border-color: var(--red); }
.q-num {
  font-size: .75rem; font-weight: 700; color: var(--navy);
  margin-bottom: .4rem;
}
.q-text { font-size: .92rem; font-weight: 600; margin-bottom: .7rem; }

.option-btn {
  display: flex; align-items: flex-start; gap: .6rem;
  width: 100%; text-align: left; padding: .7rem .8rem;
  margin-bottom: .4rem; border-radius: 8px;
  border: 2px solid var(--border);
  background: var(--surface); cursor: pointer;
  font-family: inherit; font-size: .86rem;
  line-height: 1.45; min-height: 48px;
  transition: border-color .15s, background .15s;
}
.option-btn:hover:not(.disabled) { border-color: var(--navy-light); background: #f4f5fb; }
.option-btn .letter {
  flex-shrink: 0; width: 28px; height: 28px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%; font-weight: 700; font-size: .82rem;
  background: #eef0fa; color: var(--navy);
}
.option-btn.selected { border-color: var(--navy); background: #eef0fa; }
.option-btn.correct-reveal { border-color: var(--green); background: var(--green-bg); }
.option-btn.correct-reveal .letter { background: var(--green); color: #fff; }
.option-btn.wrong-reveal { border-color: var(--red); background: var(--red-bg); }
.option-btn.wrong-reveal .letter { background: var(--red); color: #fff; }
.option-btn.disabled { cursor: default; opacity: .85; }
.option-btn.dimmed { opacity: .5; }

.justification {
  margin-top: .7rem; padding: .8rem;
  background: #f9f9fd; border-radius: 8px;
  font-size: .84rem; line-height: 1.5;
  border-left: 3px solid var(--navy);
  display: none;
}
.justification.show { display: block; animation: fadeIn .25s ease; }
.justification strong { color: var(--navy); }

/* Navigator */
.q-nav {
  display: flex; flex-wrap: wrap; gap: .3rem;
  justify-content: center; padding: .5rem;
  margin-bottom: .8rem;
}
.q-nav-btn {
  width: 36px; height: 36px; border-radius: 6px;
  border: 2px solid var(--border); background: var(--surface);
  font-size: .78rem; font-weight: 700; cursor: pointer;
  font-family: inherit; color: var(--text-muted);
  transition: all .15s;
}
.q-nav-btn.current { border-color: var(--navy); color: var(--navy); background: #eef0fa; }
.q-nav-btn.nav-correct { border-color: var(--green); color: var(--green); background: var(--green-bg); }
.q-nav-btn.nav-wrong { border-color: var(--red); color: var(--red); background: var(--red-bg); }

/* Progress bar */
.progress-bar {
  height: 6px; background: var(--border); border-radius: 3px;
  margin: .5rem 1rem; overflow: hidden;
}
.progress-fill {
  height: 100%; border-radius: 3px;
  background: linear-gradient(90deg, var(--navy), var(--orange));
  transition: width .3s;
}

/* Results panel */
.results-panel {
  background: var(--surface); border-radius: var(--radius);
  padding: 1.5rem; text-align: center; margin: 1rem 0;
  box-shadow: 0 2px 12px rgba(0,0,0,.08);
}
.results-panel .big-score {
  font-size: 3rem; font-weight: 800; color: var(--navy);
}
.results-panel .big-label { font-size: 1rem; color: var(--text-muted); margin-bottom: 1rem; }
.results-bar { display: flex; gap: 1rem; justify-content: center; margin: 1rem 0; flex-wrap: wrap; }

/* Review list */
.review-item {
  text-align: left; padding: .6rem 0;
  border-bottom: 1px solid var(--border);
  font-size: .85rem;
}
.review-item .ri-num { font-weight: 700; color: var(--navy); }
.review-item .ri-correct { color: var(--green); }
.review-item .ri-wrong { color: var(--red); }

.hidden { display: none !important; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

@media (max-width: 500px) {
  .header h1 { font-size: 1rem; }
  .q-text { font-size: .88rem; }
  .option-btn { font-size: .83rem; padding: .6rem; }
  .situation-card p { font-size: .84rem; }
}
</style>
</head>
<body>

<div class="header">
  <h1>Evaluación y Gestión Pedagógica</h1>
  <div class="subtitle">Simulacro — 46 preguntas situacionales</div>
</div>

<div id="app-scoreboard" class="scoreboard hidden">
  <span class="score-pill correct" id="pill-correct">✓ <span id="sc-correct">0</span></span>
  <span class="score-pill wrong" id="pill-wrong">✗ <span id="sc-wrong">0</span></span>
  <span class="score-pill pending" id="pill-pending">◻ <span id="sc-pending">46</span></span>
  <span class="score-pill pct" id="pill-pct"><span id="sc-pct">0</span>%</span>
</div>
<div id="app-progress" class="progress-bar hidden"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>

<div class="main">

  <!-- Start screen -->
  <div id="screen-start">
    <div style="text-align:center;padding:2rem 1rem;">
      <div style="font-size:2.5rem;margin-bottom:.5rem;">📋</div>
      <h2 style="color:var(--navy);margin-bottom:.8rem;">Banco de Casos Situacionales</h2>
      <p style="color:var(--text-muted);max-width:420px;margin:0 auto 1.5rem;font-size:.92rem;">
        46 preguntas agrupadas en 12 situaciones institucionales.<br>
        Resolución 003842/2022 · Guía 31 · SIEE · PEI
      </p>
      <div class="mode-bar" style="max-width:380px;margin:0 auto 1.2rem;">
        <button class="mode-btn active" data-mode="sequential" onclick="setMode('sequential',this)">Secuencial</button>
        <button class="mode-btn" data-mode="random" onclick="setMode('random',this)">Aleatorio</button>
      </div>
      <button class="btn btn-primary" onclick="startQuiz()" style="font-size:1rem;padding:.7rem 2rem;">
        Iniciar simulacro
      </button>
    </div>
  </div>

  <!-- Quiz screen -->
  <div id="screen-quiz" class="hidden">
    <div class="q-nav" id="q-nav"></div>
    <div id="quiz-content"></div>
    <div class="controls" id="quiz-controls">
      <button class="btn btn-outline btn-sm" onclick="prevBlock()">← Anterior</button>
      <button class="btn btn-secondary btn-sm" onclick="nextBlock()">Siguiente →</button>
      <button class="btn btn-primary btn-sm hidden" id="btn-finish" onclick="showResults()">Ver resultados</button>
    </div>
  </div>

  <!-- Results screen -->
  <div id="screen-results" class="hidden"></div>

</div>

<script>
const QUIZ_DATA = [{"start_q": 1, "end_q": 4, "situation": ["En la Institución Educativa La Esperanza, el coordinador académico recibe resultados de observaciones de aula y reportes del SIEE: en tres grados hay baja participación, tareas repetitivas y ajustes insuficientes para estudiantes con barreras de aprendizaje. El PEI declara un enfoque pedagógico por proyectos y evaluación formativa, pero varios docentes aplican guías estandarizadas y califican con pruebas únicas. Dos familias radican quejas por falta de adaptaciones y por criterios dispares entre áreas. Al mismo tiempo, el rector solicita evidencias para preparar la evaluación anual de desempeño y recuerda la Guía 31, que enfatiza un proceso sistemático, basado en evidencias y orientado al mejoramiento institucional.", "En reunión de área, los docentes argumentan presión por resultados Saber y tiempos de planeación reducidos. El coordinador revisa el manual de funciones adoptado mediante la Resolución 003842 de 2022: su rol incluye organizar, orientar y retroalimentar el trabajo pedagógico del equipo para asegurar la aplicación del enfoque del PEI. Identifica que la planeación institucional no incorpora estándares, DBA y ajustes razonables de manera coherente, y que las evidencias recogidas están dispersas. Además, observa que cada área usa rúbricas distintas y que la retroalimentación al estudiante carece de criterios verificables.", "Necesita decidir entre priorizar un informe inmediato con hallazgos generales o activar un plan de acompañamiento pedagógico con criterios comunes, observación focalizada, retroalimentación técnica y seguimiento con evidencias verificables, articulando currículo, inclusión y evaluación. La decisión impactará el clima docente, la confianza de las familias, la consistencia de la enseñanza y la rendición de cuentas institucional."], "aspect": "El coordinador organiza, orienta y retroalimenta el trabajo pedagógico de los docentes, para asegurar la aplicación del enfoque pedagógico definido en el Proyecto Educativo Institucional.", "questions": [{"num": 1, "text": "¿Qué decisión inicial se alinea mejor con el rol del coordinador para asegurar la aplicación del enfoque pedagógico del PEI?", "options": [{"letter": "A", "text": "Implementar un ciclo de estudio de resultados Saber con líderes de área, generando metas trimestrales conjuntas y difusión institucional priorizada para docentes."}, {"letter": "B", "text": "Implementar un plan de acompañamiento pedagógico con observación focalizada, retroalimentación basada en evidencias, criterios comunes verificables y acuerdos didácticos alineados al PEI."}, {"letter": "C", "text": "Implementar una capacitación intensiva sobre ajustes razonables y DUA, con expertos externos, para fortalecer inclusión y actualizar instrumentos institucionales de evaluación formativa."}], "key": "B", "justification": "La opción B operacionaliza la función del coordinador de organizar, orientar y retroalimentar el trabajo pedagógico del equipo para asegurar la aplicación del enfoque del PEI, incorporando observación y seguimiento. Además, se ajusta a la Guía 31 al privilegiar un proceso sistemático, basado en evidencias y orientado al mejoramiento, más que a acciones aisladas. A aporta análisis de resultados, pertinente pero subordinado al problema de desalineación didáctica; C fortalece inclusión, valiosa como soporte, aunque no instala de inmediato criterios comunes ni un ciclo verificable de acompañamiento."}, {"num": 2, "text": "¿Qué estrategia permite consolidar evidencias útiles para seguimiento y mejoramiento, articulando práctica docente y evaluación anual de desempeño?", "options": [{"letter": "A", "text": "Diseñar un tablero de control de planes de área con indicadores, reuniones quincenales y registro de evidencias periódico para monitorear coherencia curricular."}, {"letter": "B", "text": "Diseñar un protocolo de revisión de instrumentos evaluativos con rúbricas compartidas, muestreo de trabajos estudiantiles y retroalimentación docente registrada formalmente como evidencia."}, {"letter": "C", "text": "Diseñar una ruta de acompañamiento con observación, análisis de evidencias, compromisos de mejora y seguimiento, articulada al enfoque del PEI y SIEE."}], "key": "C", "justification": "La opción C integra observación, análisis de evidencias, compromisos y seguimiento, alineándose con la Guía 31 en su énfasis de evaluación como proceso continuo, sistemático y basado en evidencias, con finalidad de mejoramiento. En paralelo, concreta el mandato funcional del coordinador de acompañar y retroalimentar ajustes pedagógicos, garantizando trazabilidad. A fortalece monitoreo, aunque prioriza control de planeación; B mejora instrumentos, pero restringe el alcance al plano evaluativo documental, con menor efecto sobre la práctica en aula."}, {"num": 3, "text": "Ante rúbricas dispares y retroalimentación poco verificable, ¿qué acción fortalece la consistencia institucional de la evaluación y la didáctica?", "options": [{"letter": "A", "text": "Establecer criterios institucionales de evaluación y retroalimentación, mediante rúbrica marco, ejemplos ancla y calibración docente mensual, alineados a PEI, DBA y SIEE."}, {"letter": "B", "text": "Establecer un seminario de innovación pedagógica con lecturas guiadas y evidencias prácticas, para fortalecer metodologías activas y motivar ajustes didácticos en áreas."}, {"letter": "C", "text": "Establecer encuentros con familias y consejo académico para socializar lineamientos, recoger percepciones, registrar actas, acordar compromisos y fortalecer confianza comunitaria sobre evaluación."}], "key": "A", "justification": "La opción A responde directamente al problema central (criterios dispares) y concreta la función del coordinador de orientar el trabajo pedagógico y retroalimentar ajustes para asegurar la aplicación del enfoque del PEI, incorporando un mecanismo de calibración y evidencias consistentes. También fortalece el carácter evidencial y orientado al mejoramiento promovido por Guía 31, al permitir valoración comparable y seguimiento. B promueve mejora metodológica, pertinente pero secundaria frente a la urgencia de criterios comunes; C fortalece relación con familias, relevante para legitimidad, con efecto indirecto sobre la consistencia técnico–didáctica."}, {"num": 4, "text": "¿Qué curso de acción asegura retroalimentación docente verificable y rendición de cuentas, manteniendo prioridad pedagógica?", "options": [{"letter": "A", "text": "Consolidar un informe técnico para rectoría con hallazgos y recomendaciones, anexando evidencias confiables trianguladas, para sustentar decisiones de evaluación anual de desempeño."}, {"letter": "B", "text": "Consolidar un plan trimestral de acompañamiento con metas por área verificables, observaciones, retroalimentación individual, seguimiento a compromisos y evidencias, articulado al PEI."}, {"letter": "C", "text": "Consolidar una agenda de talleres con especialistas externos sobre evaluación e inclusión, convocando áreas, para fortalecer capacidades y actualizar documentos institucionales pertinentes."}], "key": "B", "justification": "La opción B instala un ciclo completo de acompañamiento: metas, observación, retroalimentación, seguimiento y evidencias, alineado con la función del coordinador de organizar, orientar y retroalimentar el trabajo pedagógico para garantizar el enfoque del PEI, además de hacer seguimiento a ajustes. Asimismo, se ajusta al enfoque de Guía 31 al privilegiar un proceso sistemático, evidencial y orientado al mejoramiento. A aporta soporte para decisiones, pero centra la respuesta en producto documental; C actualiza capacidades, pertinente como fortalecimiento, aunque con menor impacto inmediato en seguimiento verificable de prácticas."}]}, {"start_q": 5, "end_q": 8, "situation": ["En la Institución Educativa Oficial El Paraíso, el coordinador académico recibe alertas de tres fuentes: auditoría interna del SIEE, quejas de familias y revisión de cuadernos. En séptimo y octavo aparecen planes de aula desconectados del plan de estudios institucional; algunos docentes trabajan por “temas sueltos”, otros aplican guías comerciales, y varios criterios de evaluación cambian cada periodo. En el mismo grupo hay estudiantes con ajustes razonables aprobados, pero las evidencias muestran tareas idénticas y retroalimentación basada en puntajes, con escasa descripción de desempeño.", "El rector solicita al coordinador un informe en cinco días para sustentar acciones del Plan de Mejoramiento y para la evaluación anual de desempeño. El coordinador revisa su manual de funciones adoptado por la Resolución 003842 de 2022: le corresponde evaluar permanentemente el desarrollo de planes de estudio, métodos de enseñanza, criterios y metodologías de evaluación del aprendizaje. También consulta la Guía 31, que exige un proceso continuo, sistemático y sustentado en evidencias, con seguimiento a compromisos.", "Surge el dilema: aplicar una verificación rápida centrada en formatos y actas, o implementar un ciclo breve de evaluación pedagógica con observación de aula, análisis de instrumentos evaluativos, revisión de planeaciones y acuerdos de mejora verificables. La decisión implica balancear autonomía docente, tiempos reales de planeación, atención a la diversidad, consistencia del SIEE y la necesidad de evidencias robustas para decisiones institucionales. La supervisión municipal visita en dos semanas."], "aspect": "El coordinador evalúa permanentemente el desarrollo de planes de estudio, métodos de enseñanza, criterios y metodologías de evaluación del aprendizaje de los estudiantes.", "questions": [{"num": 5, "text": "¿Cuál acción prioriza mejor la evaluación permanente de planes de estudio, métodos de enseñanza y evaluación del aprendizaje, con decisión sustentada en evidencias?", "options": [{"letter": "A", "text": "Implementar una matriz de revisión documental de planes de área, con checklist curricular, cronograma bimestral, evidencias adjuntas y reporte consolidado para rectoría."}, {"letter": "B", "text": "Implementar un ciclo corto de evaluación pedagógica con observación de aula, análisis de instrumentos, retroalimentación técnica y acuerdos verificables institucionales por área."}, {"letter": "C", "text": "Implementar jornadas de formación docente sobre evaluación formativa e inclusión, con estudio de casos, talleres de rúbricas y seguimiento institucional periódico posterior."}], "key": "B", "justification": "La opción B materializa la función del cargo asociada a evaluar de manera permanente el desarrollo curricular y las prácticas de enseñanza y evaluación, al integrar observación, análisis de instrumentos y retroalimentación con acuerdos verificables. Alinea el proceso con la Guía 31 al privilegiar continuidad, sistematicidad, evidencia y seguimiento a compromisos, lo que fortalece validez de las decisiones de mejoramiento institucional. A aporta orden documental útil, pero concentra el esfuerzo en verificación de productos; C desarrolla capacidades, aunque desplaza la urgencia de recoger y valorar evidencias de práctica para tomar decisiones oportunas."}, {"num": 6, "text": "¿Qué ruta de recolección de evidencias fortalece la calidad del análisis pedagógico y sustenta el informe solicitado para evaluación anual y Plan de Mejoramiento?", "options": [{"letter": "A", "text": "Establecer un protocolo de evidencias multimétodo: observaciones, revisión de instrumentos, muestras de trabajos, entrevistas breves y registro de compromisos por periodo escolar."}, {"letter": "B", "text": "Establecer un tablero de indicadores del SIEE con análisis estadístico por docente, alertas tempranas y reuniones de socialización con el Consejo Académico."}, {"letter": "C", "text": "Establecer un plan de auditoría de cumplimiento de formatos curriculares, actas y horarios, con verificación muestral y reporte de hallazgos y recomendaciones."}], "key": "A", "justification": "La opción A coincide con la Guía 31 al promover evidencia diversa y recogida de forma metódica, fortaleciendo objetividad, validez y confiabilidad del juicio evaluativo, además de habilitar seguimiento a compromisos. Se articula con el rol del coordinador al generar insumos para valorar planes, métodos e instrumentos de evaluación, sustentando decisiones de mejora y soportes para evaluación anual. B aporta lectura cuantitativa útil, aunque no sustituye evidencias directas de práctica e instrumentos; C ordena cumplimiento formal, pero tiene menor potencia explicativa sobre la calidad didáctica y evaluativa observada."}, {"num": 7, "text": "¿Qué decisión incrementa coherencia y equidad en criterios y metodologías de evaluación del aprendizaje, considerando diversidad y consistencia del SIEE?", "options": [{"letter": "A", "text": "Alinear las pruebas internas con estándares y matrices de referencia, aplicando simulacros por periodo y análisis comparativo de resultados por área institucional."}, {"letter": "B", "text": "Alinear un programa de mentoría entre pares para observar clases, compartir estrategias y elaborar secuencias didácticas interdisciplinarias en cada grado, con evidencias."}, {"letter": "C", "text": "Alinear criterios institucionales de evaluación mediante rúbrica marco, descriptores de desempeño, ajustes razonables, calibración docente y retroalimentación observable en aula, por periodo."}], "key": "C", "justification": "La opción C responde al núcleo del problema: variación de criterios entre periodos y áreas, y ausencia de retroalimentación verificable. Fortalece coherencia curricular y equidad al fijar descriptores comunes, incorporar ajustes razonables y realizar calibración, generando evidencia comparable y trazable. La Guía 31 enfatiza criterios comunes, evidencia y seguimiento como condiciones para decisiones de mejoramiento; y el manual de funciones asociado a la Resolución 003842 orienta al directivo docente a evaluar permanentemente planes, métodos y evaluación del aprendizaje, lo que se operacionaliza con esta acción. A mejora medición de resultados, pero no corrige la dispersión de criterios; B fortalece práctica docente, aunque actúa más como desarrollo profesional que como estandarización evaluativa institucional."}, {"num": 8, "text": "Ante el informe exigido en cinco días y la visita de supervisión, ¿qué salida integra exigencia de rendición de cuentas y prioridad pedagógica?", "options": [{"letter": "A", "text": "Consolidar un informe ejecutivo en cinco días con hallazgos generales, anexos de formatos revisados y recomendaciones para el Plan de Mejoramiento institucional."}, {"letter": "B", "text": "Consolidar un reporte con evidencias trianguladas, análisis de coherencia curricular, compromisos por docente y seguimiento calendarizado, articulado a evaluación anual de desempeño."}, {"letter": "C", "text": "Consolidar una agenda de acompañamiento con talleres, asesoría individual, repositorio de instrumentos y seguimiento, para fortalecer capacidad evaluativa institucional en el trimestre."}], "key": "B", "justification": "La opción B integra evidencia triangulada, análisis técnico, compromisos y seguimiento, coherente con la Guía 31 al sostener un proceso continuo, sistemático y basado en evidencias, con trazabilidad de acuerdos. A la vez, produce insumos verificables para decisiones institucionales y para la evaluación anual, en correspondencia con las responsabilidades del cargo establecidas en el manual de funciones adoptado por la Resolución 003842 de 2022. A cumple con la entrega, pero privilegia síntesis documental con menor capacidad de seguimiento; C fortalece capacidades, aunque desplaza la necesidad inmediata de evidencias robustas y compromisos calendarizados."}]}, {"start_q": 9, "end_q": 12, "situation": ["En la Institución Educativa Rural San Miguel del Río, el coordinador académico identifica brechas entre el PEI y lo que ocurre en aula. En primaria, Lenguaje trabaja con plan lector basado en fichas antiguas; en secundaria, Ciencias usa un texto comercial que no dialoga con Estándares Básicos de Competencias ni con DBA. Al revisar planeaciones, halla objetivos por “temas” y actividades repetitivas, con poca progresión por grados. En actas del Consejo Académico aparecen acuerdos sobre inclusión y evaluación formativa, pero en cuadernos de estudiantes se observan calificaciones por promedio y retroalimentación mínima, lo que incrementa reclamos de familias.", "La Secretaría de Educación anuncia visita de seguimiento curricular y solicita evidencias de incorporación de lineamientos, orientaciones curriculares y desarrollos recientes del Ministerio de Educación Nacional. El rector pide al coordinador soportes para el Plan de Mejoramiento y para la evaluación anual de desempeño. El coordinador consulta el Manual de Funciones adoptado mediante la Resolución 003842 de 2022, que le asigna fomentar el conocimiento y la incorporación de estándares, lineamientos y orientaciones curriculares. También revisa la Guía 31, que describe la evaluación como proceso continuo, sistemático y basado en evidencias, orientado al mejoramiento.", "El dilema es definir una acción prioritaria: enviar directrices generales y exigir ajustes documentales rápidos, o instalar una estrategia de apropiación pedagógica por áreas con análisis de referentes MEN, acuerdos didácticos, acompañamiento en aula y seguimiento a evidencias verificables por periodo. Además, dos docentes nuevos argumentan que la malla vigente cumple; otros piden claridad sobre rutas de actualización institucional."], "aspect": "El coordinador fomenta el conocimiento y la incorporación de los estándares básicos de competencias, los lineamientos y las orientaciones curriculares para las diferentes áreas y grados, así como otros desarrollos que promueva el Ministerio de Educación Nacional.", "questions": [{"num": 9, "text": "¿Qué decisión inicial fortalece mejor la incorporación de estándares, lineamientos y orientaciones curriculares en las prácticas de aula, ante la visita de seguimiento?", "options": [{"letter": "A", "text": "Implementar una circular institucional con enlaces a estándares, lineamientos y DBA, solicitando ajustes de planeación y evidencias para visita, con cronograma semanal."}, {"letter": "B", "text": "Implementar un taller general sobre currículo por competencias, presentando documentos MEN y ejemplos, y asignando productos de lectura posterior para cada área."}, {"letter": "C", "text": "Implementar una ruta por áreas con análisis de estándares y DBA, revisión de planeaciones, acompañamiento en aula y evidencias trazables para seguimiento."}], "key": "C", "justification": "La alternativa C concreta la función del cargo asociada a fomentar conocimiento e incorporación de referentes MEN, al traducirlos en planeación, mediación y evidencias de aula verificables. También se ajusta a la Guía 31 al estructurar un proceso sistemático, con evidencia y seguimiento orientado al mejoramiento institucional. A aporta orden para la visita, aunque privilegia el plano documental; B aporta actualización conceptual, aunque su impacto en el aula y en la trazabilidad de evidencias resulta menos inmediato."}, {"num": 10, "text": "¿Qué estrategia instala un mecanismo sostenible para que los docentes conozcan y apropien los desarrollos curriculares del MEN por grados y áreas?", "options": [{"letter": "A", "text": "Diseñar un portafolio curricular por grado con mapas de progresión, enlaces oficiales MEN, ejemplos de desempeño y sesiones de apropiación guiadas bimestrales."}, {"letter": "B", "text": "Diseñar un encuentro institucional de socialización de documentos MEN con expertos, relatorías técnicas y compromisos, publicando memoria digital para consulta periódica docente."}, {"letter": "C", "text": "Diseñar una encuesta diagnóstica sobre uso de estándares por áreas, elaborar informe analítico y presentar resultados al Consejo Académico para decisiones posteriores."}], "key": "A", "justification": "La opción A instala un dispositivo técnico de apropiación y transferencia a la práctica: progresiones, ejemplos y sesiones guiadas, lo que habilita incorporación efectiva en planes de estudio y prácticas docentes, en coherencia con el Manual de Funciones adoptado por la Resolución 003842 de 2022. Además, permite evidenciar avance y seguimiento, alineado con la Guía 31 (evaluación basada en evidencias y orientada al mejoramiento). B favorece divulgación, aunque depende de replicación posterior en aula; C aporta diagnóstico útil, pero no garantiza apropiación ni incorporación curricular."}, {"num": 11, "text": "¿Qué acción impacta con mayor pertinencia la alineación entre métodos de enseñanza, evaluación formativa y referentes MEN, atendiendo la diversidad?", "options": [{"letter": "A", "text": "Alinear un plan de lectura de estándares por áreas, con círculos de estudio y resúmenes, para fortalecer conocimiento conceptual docente de aula."}, {"letter": "B", "text": "Alinear secuencias didácticas y criterios de evaluación a estándares y DBA, mediante revisión de planeaciones, rúbricas marco y retroalimentación observada por periodo."}, {"letter": "C", "text": "Alinear simulacros internos y análisis de resultados externos a estándares, estableciendo metas por grado y estrategias de refuerzo diferenciadas en cada área."}], "key": "B", "justification": "La alternativa B vincula referentes MEN con decisiones didácticas y evaluativas, y añade verificación en aula mediante retroalimentación observada y rúbricas marco, elevando consistencia y equidad para estudiantes con ajustes razonables. Esta forma de intervención expresa la responsabilidad funcional de promover incorporación de estándares y orientaciones curriculares en la práctica institucional. También produce evidencias idóneas para seguimiento, coherentes con la Guía 31 (proceso sistemático con evidencias y compromisos). A fortalece comprensión, aunque su impacto en decisiones de aula resulta indirecto; C orienta resultados, aunque prioriza medición y refuerzo sobre alineación curricular cotidiana."}, {"num": 12, "text": "¿Qué producto de gestión ofrece la mejor evidencia institucional para la visita, el Plan de Mejoramiento y la evaluación anual de desempeño?", "options": [{"letter": "A", "text": "Consolidar un informe de cumplimiento documental con actas, formatos y cronogramas, reportando porcentaje de actualización de mallas por áreas para decisión institucional."}, {"letter": "B", "text": "Consolidar una agenda de formación continua con expertos, guías de estudio y repositorio digital, registrando asistencia y productos elaborados por áreas priorizadas."}, {"letter": "C", "text": "Consolidar un portafolio de evidencias con planeaciones alineadas, instrumentos evaluativos, muestras estudiantiles, observaciones y compromisos, para seguimiento y mejora con criterios comunes."}], "key": "C", "justification": "La opción C integra evidencia documental y testimonial pertinente (planeaciones, instrumentos, muestras, observaciones y compromisos), aumentando solidez para decisiones de mejoramiento y para evaluación anual, tal como orienta la Guía 31. A su vez, refleja el alcance funcional del cargo establecido en el Manual de Funciones (promover incorporación de referentes MEN y evidenciar su aplicación institucional). A aporta trazabilidad administrativa; B evidencia fortalecimiento de capacidades, aunque con menor potencia probatoria sobre transformación de aula."}]}, {"start_q": 13, "end_q": 16, "situation": ["En la Institución Educativa Departamental Mirador de la Ciénaga, ubicada en una zona de alta movilidad estudiantil, el coordinador académico observa que cada área usa referentes distintos para planear. En Matemáticas de sexto se trabaja con un cuaderno de ejercicios heredado; en Ciencias de noveno se priorizan talleres memorísticos; en Lengua Castellana se aplican lecturas desconectadas del avance por grados. La revisión de planeaciones muestra indicadores redactados como temas y actividades, con escasa relación con Estándares Básicos de Competencias, lineamientos y orientaciones curriculares del MEN. Llegan tres docentes provisionales y solicitan “la malla oficial”, pero encuentran versiones diferentes en carpetas físicas y en la nube institucional con claves de acceso desiguales. Además, estudiantes con apoyos definidos en el PIAR reciben tareas homogéneas y evaluación basada en puntajes, lo que genera reclamaciones formales de familias.", "La rectoría recibe una circular de la Secretaría de Educación: en diez días habrá verificación de actualización curricular y se pedirán evidencias de apropiación de documentos MEN recientes. El coordinador consulta el manual de funciones incorporado en la Resolución 003842 de 2022, que le asigna promover el conocimiento y la incorporación de dichos referentes en todas las áreas y grados. Relee la Guía 31, que orienta la evaluación directiva como proceso continuo, sistemático y sustentado en evidencias para mejorar la gestión académica.", "Debe decidir entre emitir orientaciones generales y solicitar ajustes inmediatos de documentos, o liderar una ruta de apropiación por áreas con análisis de progresiones, acompañamiento en aula y seguimiento a evidencias verificables por periodo."], "aspect": "El coordinador fomenta el conocimiento y la incorporación de los estándares básicos de competencias, los lineamientos y las orientaciones curriculares para las diferentes áreas y grados, así como otros desarrollos que promueva el Ministerio de Educación Nacional.", "questions": [{"num": 13, "text": "¿Qué decisión prioritaria favorece la incorporación efectiva de estándares, lineamientos y orientaciones curriculares en las prácticas de aula, ante la verificación anunciada?", "options": [{"letter": "A", "text": "Implementar una ruta por áreas que analice estándares, lineamientos y DBA, ajuste secuencias didácticas, observe clases y registre evidencias en cada grado."}, {"letter": "B", "text": "Implementar un seminario institucional con expertos, lecturas guiadas y banco digital de recursos MEN, fortaleciendo lenguaje curricular y compromiso docente durante trimestre."}, {"letter": "C", "text": "Implementar un requerimiento de actualización de mallas y planes de aula, solicitando anexos de estándares y cronograma de entrega por áreas mensuales."}], "key": "A", "justification": "A es la alternativa más pertinente porque traduce la responsabilidad funcional establecida en la Resolución 003842 de 2022 (fomentar conocimiento e incorporación de referentes MEN) en acciones de aula verificables (ajuste didáctico, observación y evidencias). Además, se alinea con la Guía 31 al privilegiar un proceso sistemático, sustentado en evidencias y con orientación al mejoramiento. B fortalece apropiación conceptual, pero su impacto inmediato en planeación y práctica depende de transferencias posteriores; C ordena actualización documental, aunque aporta evidencia más administrativa que pedagógica."}, {"num": 14, "text": "¿Qué estrategia de seguimiento permite demostrar apropiación y aplicación de referentes MEN, con evaluación continua y evidencias robustas?", "options": [{"letter": "A", "text": "Diseñar un tablero de control con indicadores por área, usando resultados internos y externos, para orientar ajustes curriculares semestrales con reporte público."}, {"letter": "B", "text": "Diseñar una estrategia de mentoría entre pares, con observaciones recíprocas, diarios reflexivos y socialización de experiencias, para fortalecer metodologías activas en aula."}, {"letter": "C", "text": "Diseñar un ciclo de evaluación pedagógica con rúbricas marco, revisión de planeaciones, muestras estudiantiles y compromisos, verificando avances por periodo en actas."}], "key": "C", "justification": "C responde de manera directa a la Guía 31, que enfatiza evaluación directiva como proceso continuo, sistemático, basado en evidencias y con seguimiento a compromisos; también operacionaliza el rol directivo del coordinador previsto en la Resolución 003842 de 2022 al asegurar incorporación curricular verificable. A es valiosa para monitoreo macro, pero no sustituye evidencias de planeación, instrumentos y productos; Bfortalece desarrollo profesional, aunque ofrece trazabilidad menos homogénea para demostrar incorporación institucional por periodos."}, {"num": 15, "text": "Ante versiones dispersas de la malla y resistencia de docentes nuevos, ¿qué acción asegura apropiación por grados y coherencia institucional?", "options": [{"letter": "A", "text": "Establecer un repositorio institucional de documentos MEN, guías comentadas y ejemplos de planeación, con acceso permanente y curaduría mensual por comité académico."}, {"letter": "B", "text": "Establecer mesas por grado para mapear progresiones, acordar desempeño, integrar ajustes razonables y planear clases modelo con seguimiento mediante observación y retroalimentación."}, {"letter": "C", "text": "Establecer una jornada de revisión de PEI y SIEE, ajustando documentos institucionales y comunicados, para responder a la visita municipal con prioridad."}], "key": "B", "justification": "B es la opción más pertinente porque instala apropiación situada por grados (progresiones y desempeños), incorpora atención a la diversidad (ajustes razonables) y asegura verificación en práctica mediante observación y retroalimentación, lo cual soporta la incorporación de desarrollos MEN exigida por la Resolución 003842 de 2022. A la vez, cumple el estándar de la Guía 31: evidencia, seguimiento y mejora. Afortalece disponibilidad y acceso a documentos, pero no garantiza adopción en la práctica; C organiza respuesta institucional, aunque prioriza ajuste documental frente al cambio pedagógico verificable."}, {"num": 16, "text": "¿Qué producto final ofrece evidencia institucional suficiente para decisiones de mejoramiento y rendición de cuentas, con enfoque pedagógico?", "options": [{"letter": "A", "text": "Consolidar un portafolio de evidencias trianguladas: planeaciones alineadas, instrumentos, trabajos estudiantiles, observaciones, retroalimentación y compromisos, con seguimiento programado por área cada periodo."}, {"letter": "B", "text": "Consolidar un informe ejecutivo con hallazgos y recomendaciones, anexando actas, cronogramas y formatos, para entrega a rectoría y supervisión en fecha acordada."}, {"letter": "C", "text": "Consolidar un plan anual de formación docente en currículo y evaluación, con alianzas universitarias, certificación y medición de impacto institucional por cohortes."}], "key": "A", "justification": "A maximiza fuerza probatoria porque integra evidencias de planeación, enseñanza, evaluación y retroalimentación, más compromisos y seguimiento por periodos, en coherencia con la Guía 31 (evidencias y mejora) y con la Resolución 003842 de 2022 (incorporación de referentes MEN en áreas y grados). B es útil para comunicación institucional, pero se concentra en soportes administrativos; C fortalece capacidades a mediano plazo, aunque su evidencia sobre incorporación efectiva en aula es menos directa."}]}, {"start_q": 17, "end_q": 20, "situation": ["En la Institución Educativa Distrital Puerta del Manglar, el coordinador académico enfrenta aumento de conflictos por mensajes virales y por tareas copiadas de internet. En quinto circulan cadenas que generan temor; en octavo se presentan debates polarizados; en undécimo aparecen trabajos con citas dudosas. El PEI plantea formar pensamiento crítico y comunicación ética, pero los planes de área avanzan por unidades aisladas. La orientadora propone un proyecto institucional de ciudadanía digital que articule Lengua, Sociales, Matemáticas, Tecnología y Artística entre primaria, secundaria y media, incorporando apoyos para estudiantes con PIAR.", "En reunión pedagógica, surgen posturas opuestas: algunos docentes prefieren charlas por grado, otros plantean clubes extracurriculares, y varios piden que cada área conserve su programación. El coordinador identifica que, para lograr articulación real, se requiere una secuencia por niveles con productos auténticos: bitácoras de verificación, análisis de datos de fuentes, guiones argumentativos y campañas comunicativas para la comunidad. También advierte que la institución necesita evidencias para la evaluación anual de desempeño y para el Plan de Mejoramiento.", "Al revisar el manual de funciones adoptado mediante la Resolución 003842 de 2022, confirma responsabilidades de liderazgo y orientación del trabajo docente. Al consultar la Guía 31, identifica la competencia que demanda desarrollar proyectos pedagógicos que articulen áreas, grados y niveles, y reconoce que la evaluación directiva se apoya en procesos continuos, sistemáticos y basados en evidencias, con seguimiento a compromisos.", "Ahora necesita decidir si impulsa un proyecto integrado con rúbricas y seguimiento, o si autoriza acciones dispersas por área con menor coordinación."], "aspect": "El coordinador desarrolla proyectos pedagógicos que articulen diferentes áreas, grados y niveles.", "questions": [{"num": 17, "text": "¿Qué decisión inicial resulta más pertinente para desarrollar el proyecto pedagógico articulador y asegurar trazabilidad evaluativa?", "options": [{"letter": "A", "text": "Diseñar un ciclo de charlas por grados con expertos, guías de participación, compromisos de convivencia digital y evaluación de satisfacción estudiantil anual."}, {"letter": "B", "text": "Diseñar un proyecto integrado por niveles, alineado a PEI y orientaciones MEN, con productos auténticos, rúbricas y seguimiento evidencial trimestral por área."}, {"letter": "C", "text": "Diseñar un repositorio institucional de recursos y secuencias, con curaduría por áreas, foros docentes y acompañamiento didáctico periódico con evidencias en aula."}], "key": "B", "justification": "B concreta la competencia de la Guía 31 asociada a desarrollar proyectos pedagógicos articulados entre áreas, grados y niveles, y garantiza seguimiento evidencial con rúbricas, lo cual incrementa objetividad y consistencia del proceso. Además, se alinea con el marco funcional del manual adoptado por la Resolución 003842/2022, al traducir liderazgo pedagógico en una ruta institucional verificable. Afortalece sensibilización, pero su transferencia a planeación y productos integrados queda indirecta; C mejora disponibilidad y acompañamiento, aunque no asegura articulación estructurada por niveles."}, {"num": 18, "text": "¿Qué acción organizativa incrementa la articulación real entre niveles y áreas, incorporando diversidad y compromisos verificables?", "options": [{"letter": "A", "text": "Establecer equipos por nivel con líderes de área, mapa de progresión, ajustes PIAR, rúbrica común, reuniones quincenales y actas verificables por periodo."}, {"letter": "B", "text": "Establecer un club extracurricular de verificación informativa, con estudiantes voluntarios, mediadores digitales y difusión semanal, articulando actividades con familias para cada grado."}, {"letter": "C", "text": "Establecer un comité de convivencia para revisar casos, actualizar manual y reportar indicadores, articulando talleres preventivos con orientación escolar en cada sede."}], "key": "B", "justification": "A (sic) habilita articulación entre niveles mediante progresión, ajustes PIAR y rúbrica común, generando acuerdos y evidencias para seguimiento, condición central de evaluación sistemática y basada en evidencias descrita por la Guía 31. También operacionaliza el rol directivo definido en el manual adoptado por la Resolución 003842/2022, al orientar el trabajo docente hacia el enfoque del PEI con organización verificable. B es pertinente como estrategia complementaria, pero su alcance institucional y curricular resulta parcial; C fortalece gestión convivencial, aunque es secundaria frente al reto de articulación pedagógica interáreas."}, {"num": 19, "text": "Durante la implementación, ¿qué decisión asegura control de calidad pedagógica y mejora continua del proyecto articulador?", "options": [{"letter": "A", "text": "Implementar un sistema de reportes de avance por docente, con indicadores de cumplimiento, entregables por área y revisión documental semanal con evidencias."}, {"letter": "B", "text": "Implementar una semana institucional de foros y debates, con jurados externos, premios por innovación y difusión comunitaria para motivar participación estudiantil intergrados."}, {"letter": "C", "text": "Implementar un ciclo de seguimiento con observación, análisis de productos, rúbricas compartidas, retroalimentación docente y ajuste de secuencias por periodo con acuerdos."}], "key": "C", "justification": "C es la opción más pertinente porque integra observación, valoración de productos, retroalimentación y ajustes por periodo, respondiendo al carácter continuo, sistemático y evidencial del proceso evaluativo planteado por la Guía 31. Además, fortalece liderazgo pedagógico y orientación del trabajo docente, coherente con el marco del manual adoptado por la Resolución 003842/2022. A aporta control de ejecución, aunque privilegia verificación documental; B promueve motivación y visibilidad, con menor potencia para asegurar alineación curricular y mejora derivada de evidencias."}, {"num": 20, "text": "Al cierre del ciclo, ¿qué producto ofrece mejor evidencia institucional para retroalimentar planes de área y sostener el proyecto interáreas?", "options": [{"letter": "A", "text": "Consolidar un informe de gestión para rectoría con resultados, cronograma de actividades, gastos, fotografías y lista de asistencia por nivel y anexos."}, {"letter": "B", "text": "Consolidar un portafolio pedagógico con mapa curricular integrado, evidencias por grado, ajustes PIAR, rúbricas y plan de mejora con seguimiento trimestral responsables."}, {"letter": "C", "text": "Consolidar alianzas externas con universidades y ONG, gestionando financiación y certificaciones, para ampliar impacto del proyecto en próximos años para cada nivel."}], "key": "B", "justification": "B concentra evidencia pedagógica y curricular (mapa integrado, rúbricas, ajustes PIAR, plan de mejora y seguimiento), lo que fortalece decisiones institucionales con base en evidencias y compromisos, como exige la Guía 31. También es consistente con el marco funcional del manual adoptado por la Resolución 003842/2022 al dejar trazabilidad de la orientación pedagógica institucional. A prioriza rendición de cuentas administrativa; C aporta sostenibilidad externa, aunque su evidencia sobre articulación curricular lograda queda meadiada por acciones futuras."}]}, {"start_q": 21, "end_q": 24, "situation": ["En la Institución Educativa Técnica Nuevo Horizonte, el coordinador académico recibe un reporte de deserción parcial en décimo y bajo desempeño en lectura crítica en séptimo. Varias observaciones de aula evidencian clases expositivas, uso mínimo de datos de aprendizaje y escasa experimentación didáctica. Dos docentes presentan propuestas: una secuencia de aula invertida con analítica de aprendizaje y otra investigación acción sobre evaluación formativa para estudiantes con PIAR. Sin embargo, otros docentes cuestionan la rigurosidad, temen sobrecarga documental y solicitan orientaciones para proteger el plan de estudios.", "La rectoría exige resultados medibles en ocho semanas, porque el Plan de Mejoramiento priorizó competencias comunicativas y pensamiento científico. Además, una auditoría interna detectó que los proyectos innovadores previos no dejaron evidencias comparables ni retroalimentación sistemática. El coordinador revisa el manual de funciones adoptado mediante la Resolución 003842 de 2022, que orienta su rol de liderazgo pedagógico y acompañamiento al trabajo docente. También consulta la Guía 31, que define la evaluación anual como proceso continuo, sistemático y basado en evidencias, y que valora la capacidad de motivar, asesorar y apoyar innovación e investigación pedagógica.", "El dilema consiste en decidir entre autorizar experiencias aisladas, concentrarse en capacitaciones generales, o estructurar un programa institucional de innovación con criterios, seguimiento y difusión de hallazgos. La decisión debe equilibrar calidad metodológica, pertinencia curricular, protección del tiempo docente, inclusión de estudiantes con apoyos y disponibilidad de evidencias verificables para la evaluación anual y para ajustes del currículo institucional. La supervisión municipal solicitó socializar aprendizajes y evidencias en Consejo Académico."], "aspect": "El coordinador motiva, asesora y apoya la innovación y la investigación pedagógica por parte de los docentes, para potenciar procesos de aprendizaje.", "questions": [{"num": 21, "text": "Ante el dilema planteado, ¿qué acción del coordinador resulta más pertinente para motivar, asesorar y apoyar innovación e investigación pedagógica con calidad y trazabilidad?", "options": [{"letter": "A", "text": "Implementar un ciclo de talleres sobre innovación, con lecturas guiadas, experto invitado, productos demostrativos y socialización institucional, para motivar prácticas renovadas gradualmente."}, {"letter": "B", "text": "Implementar un programa institucional de innovación pedagógica, con criterios de calidad, acompañamiento metodológico, registro de evidencias y seguimiento, para mejorar aprendizajes priorizados."}, {"letter": "C", "text": "Implementar una convocatoria de proyectos investigativos docentes, con incentivos, comité evaluador, divulgación externa y alianzas universitarias, para fortalecer investigación y reconocimiento profesional."}], "key": "B", "justification": "B es la alternativa más pertinente porque instala un sistema institucional con criterios, acompañamiento y evidencia verificable, lo que se ajusta al enfoque de la Guía 31 (proceso continuo, sistemático y basado en evidencias, con seguimiento para el mejoramiento) y permite sustentar decisiones de evaluación anual. A la vez, se alinea con el Manual de Funciones adoptado por la Resolución 003842 al traducir el liderazgo pedagógico en orientación y soporte estructurado al trabajo docente. Afavorece sensibilización, pero no asegura control de calidad ni evidencia comparable; C fortalece reconocimiento y redes, aunque desplaza la urgencia de impacto en aula y de trazabilidad institucional en ocho semanas."}, {"num": 22, "text": "¿Qué decisión metodológica asegura rigor y pertinencia curricular en las propuestas docentes, reduciendo riesgos de sobrecarga documental y elevando la calidad de la evidencia?", "options": [{"letter": "A", "text": "Diseñar un banco de estrategias innovadoras por área, con fichas didácticas, recursos digitales, ejemplos de clase y orientaciones, para replicar experiencias contextualizadas."}, {"letter": "B", "text": "Diseñar un esquema de estímulos e incentivos docentes, con convocatoria, criterios de selección, difusión de resultados y reconocimiento público, para aumentar participación."}, {"letter": "C", "text": "Diseñar un protocolo institucional de investigación acción, con preguntas orientadoras, instrumentos, cronograma, asesoría metodológica y análisis de evidencias, para ajustar enseñanza continuamente."}], "key": "C", "justification": "C es la opción más pertinente porque convierte la innovación en investigación pedagógica con estándares de calidad (preguntas, instrumentos, análisis) y evidencia utilizable para decisiones, coherente con la Guía 31 al privilegiar sistematicidad, evidencia y seguimiento a compromisos de mejora. Además, operacionaliza el sentido del Manual de Funciones (orientación y acompañamiento del trabajo pedagógico) al asesorar con rigor, protegiendo la pertinencia curricular. A facilita replicación, pero no garantiza validez metodológica; B aumenta participación, aunque no resuelve el requerimiento de rigor y evidencias comparables."}, {"num": 23, "text": "Con el plazo de ocho semanas y la prioridad del Plan de Mejoramiento, ¿qué estrategia optimiza impacto en aprendizaje y escalabilidad institucional?", "options": [{"letter": "A", "text": "Establecer un piloto institucional con aula invertida e investigación acción, metas de aprendizaje, acompañamiento semanal, evidencia comparativa y ajuste curricular por periodo."}, {"letter": "B", "text": "Establecer una comunidad de práctica docente, con reuniones mensuales, lectura de investigaciones, intercambio de recursos y ponencias internas, para fortalecer cultura innovadora."}, {"letter": "C", "text": "Establecer un tablero de seguimiento de resultados, con análisis estadístico, reportes por área, alertas tempranas y comunicación directiva, para orientar decisiones oportunas."}], "key": "A", "justification": "A es superior porque integra innovación e investigación con metas, acompañamiento y evidencia comparativa en un ciclo corto, generando resultados verificables para el mejoramiento, tal como caracteriza la Guía 31 el proceso evaluativo (continuo, sistemático y basado en evidencia). También es consistente con el Manual de Funciones al materializar apoyo y asesoría pedagógica en acciones observables y con ajustes curriculares derivados de evidencias. B fortalece cultura institucional, pero su cadencia mensual reduce oportunidad; C aporta monitoreo, aunque por sí mismo no moviliza innovación ni investigación en aula."}, {"num": 24, "text": "¿Qué evidencia de cierre sustenta mejor la evaluación anual y la toma de decisiones curriculares, demostrando impacto real de innovación e investigación pedagógica?", "options": [{"letter": "A", "text": "Consolidar un informe administrativo de innovación, con cronograma, asistencia, actas, presupuesto y fotografías, para reportar ejecución institucional ante rectoría y sustentar decisiones."}, {"letter": "B", "text": "Consolidar un convenio con universidad para formar docentes investigadores, con diplomado, tutorías, certificación y publicación, para fortalecer capacidades institucionales sostenibles en aula."}, {"letter": "C", "text": "Consolidar un portafolio pedagógico de innovación, con diseños, instrumentos, evidencias, análisis de impacto, lecciones aprendidas y plan de escalamiento anual por niveles."}], "key": "C", "justification": "C entrega evidencia pedagógica completa (diseños, instrumentos, impacto, lecciones y escalamiento), lo que permite retroalimentación y decisiones curriculares con base en evidencia, en línea con la Guía 31 y su orientación al mejoramiento con seguimiento. Asimismo, conecta con el Manual de Funciones al demostrar asesoría y apoyo efectivo a innovación e investigación mediante productos verificables y escalables. A prioriza rendición administrativa; B potencia capacidades futuras, aunque su evidencia de impacto inmediato y comparabilidad institucional queda mediada por ejecución posterior."}]}, {"start_q": 25, "end_q": 28, "situation": ["En la Institución Educativa Oficial Sierra del Bosque, el coordinador académico recibe tres señales contradictorias: el simulacro Saber 9 bajó en Matemáticas, la evaluación interna subió en notas y la deserción aumentó en jornada tarde. Al desagregar datos, observa brechas por sede y por estudiantes migrantes recientes; en Lectura Crítica, los ítems de inferencia muestran mayor falla, y en Ciencias se evidencian dificultades en interpretación de gráficas. Varios docentes reclaman que la plataforma reporta porcentajes sin contexto y que la evaluación institucional premia tareas repetitivas. Las familias piden explicaciones porque las notas altas no coinciden con los resultados externos. En Consejo Académico surgen tensiones por comparar docentes, y algunos solicitan reservar resultados para evitar estigmas y conflictos internos.", "La Secretaría de Educación solicita un plan de mejora con metas verificables y acciones para permanencia. El rector exige al coordinador una ruta de análisis y socialización en dos semanas, y evidencia de apropiación por áreas para ajustar el plan de estudios. El coordinador revisa el manual de funciones adoptado mediante la Resolución 003842 de 2022 y confirma su responsabilidad de orientar procesos académicos y seguimiento a resultados. También retoma la Guía 31, que caracteriza la evaluación como proceso continuo, sistemático y basado en evidencias, con seguimiento a compromisos.", "El dilema consiste en elegir entre difundir reportes generales y pedir ajustes inmediatos de planeación, o liderar un ciclo institucional de lectura de datos, interpretación pedagógica, acuerdos de enseñanza y evaluación, y monitoreo de impacto en aula, articulando acciones de permanencia y calidad."], "aspect": "El coordinador coordina el análisis, la difusión y la apropiación de los resultados de evaluaciones internas y externas de los estudiantes, y formula estrategias para mejorar los índices de calidad educativa en la institución.", "questions": [{"num": 25, "text": "¿Qué acción inicial permite coordinar el análisis, la difusión y la apropiación de resultados internos y externos, protegiendo la validez del diagnóstico institucional?", "options": [{"letter": "A", "text": "Implementar mesas por áreas y sedes mediante revisión de reportes y preguntas guía, para priorizar competencias y fijar evidencias de mejora institucional."}, {"letter": "B", "text": "Implementar un informe ejecutivo mediante ranking de cursos y anexos estadísticos, para presentar recomendaciones técnicas generales al rector y difundirlas por correo."}, {"letter": "C", "text": "Implementar un ciclo institucional mediante lectura de datos y triangulación de fuentes, para acordar estrategias pedagógicas con metas, responsables y seguimiento verificable."}], "key": "C", "justification": "La opción C es la más pertinente porque organiza un proceso sistemático, multimétodo y basado en evidencias, con seguimiento a compromisos, tal como caracteriza la Guía 31 para sustentar decisiones objetivas y confiables. Además, se ajusta al marco funcional del coordinador definido en el Manual adoptado por la Resolución 003842 de 2022, al orientar la gestión académica mediante lectura técnica de resultados y acciones de mejoramiento. A es sólida para apropiación por áreas, pero todavía requiere un esquema explícito de triangulación y trazabilidad institucional; B fortalece comunicación ejecutiva, aunque concentra el esfuerzo en difusión documental y eleva el riesgo de interpretaciones parciales."}, {"num": 26, "text": "¿Qué estrategia de difusión favorece apropiación pedagógica de los resultados y reduce tensiones por comparaciones, con foco en mejoramiento?", "options": [{"letter": "A", "text": "Establecer talleres de alfabetización de datos mediante análisis de ítems y ejemplos de aula, para interpretar resultados y ajustar enseñanza por sedes."}, {"letter": "B", "text": "Establecer boletines trimestrales mediante infografías y cuadros comparativos, orientaciones pedagógicas, para informar familias y docentes sobre promedios institucionales y metas de calidad."}, {"letter": "C", "text": "Establecer mesas de diálogo mediante socialización pública de puntajes por docente, para impulsar compromisos rápidos y ajustar planeaciones por áreas en aula."}], "key": "A", "justification": "La opción A prioriza apropiación técnica y pedagógica, conectando resultados con decisiones de aula mediante lectura de ítems y evidencias, coherente con la Guía 31 cuando exige valoración metódica, basada en evidencia y orientada al mejoramiento, con rigor y objetividad. También se articula con el Manual de Funciones de la Resolución 003842 de 2022, al posicionar al coordinador como orientador de procesos académicos que convierten información evaluativa en ajuste pedagógico institucional. B es pertinente para comunicación, pero favorece comprensión general más que apropiación didáctica; C incrementa exposición y tensión, afectando clima y calidad interpretativa."}, {"num": 27, "text": "Con brechas por sede, migración reciente y deserción en jornada tarde, ¿qué estrategia formulada desde resultados impacta mejor los índices de calidad y permanencia?", "options": [{"letter": "A", "text": "Diseñar jornadas de refuerzo académico por niveles mediante clases adicionales los sábados, para elevar promedios internos y mejorar percepción de exigencia institucional."}, {"letter": "B", "text": "Diseñar un plan de tutorías focalizadas mediante grupos flexibles y materiales adaptados, para fortalecer competencias críticas y reducir deserción por jornada tarde."}, {"letter": "C", "text": "Diseñar acuerdos curriculares por áreas mediante revisión de mallas y actualización documental, para mechar contenidos con pruebas externas y reportar cumplimiento institucional."}], "key": "B", "justification": "La opción B responde al diagnóstico: focaliza brechas, integra adaptación pedagógica y vincula permanencia con aprendizaje, permitiendo evidencias de impacto por grupos y sedes. Esto se alinea con la Guía 31 al exigir decisiones sustentadas en evidencias y seguimiento a compromisos para verificar efectos positivos del mejoramiento. Además, armoniza con el Manual de Funciones adoptado por la Resolución 003842 de 2022 al orientar estrategias académicas institucionales derivadas del análisis de resultados. A puede elevar rendimiento, pero puede afectar permanencia por carga horaria y no focaliza brechas; C fortalece alineación curricular, aunque su efecto inmediato en competencias críticas y permanencia es menos directo."}, {"num": 28, "text": "¿Qué mecanismo de seguimiento permite verificar mejora real y sostener decisiones oportunas, con evidencias válidas para rendición de cuentas institucional?", "options": [{"letter": "A", "text": "Consolidar un informe mensual mediante tablas de resultados y asistencia, para reportar avances al rector y solicitar ajustes de horario institucional periódicos."}, {"letter": "B", "text": "Consolidar un repositorio digital mediante actas y presentaciones, con criterios comunes, para conservar evidencias de socialización y facilitar consulta a docentes nuevos."}, {"letter": "C", "text": "Consolidar un sistema de seguimiento mediante indicadores, observación de aula y revisión de evidencias, para verificar impacto y ajustar estrategias acordadas institucionalmente."}], "key": "C", "justification": "La opción C es superior porque integra indicadores y evidencia de práctica (observación y productos), habilitando seguimiento metódico y ajustes oportunos; esto coincide con la Guía 31 cuando plantea continuidad, sistematicidad, evidencia y seguimiento a compromisos como condiciones de rigor. Asimismo, se articula con el Manual de Funciones de la Resolución 003842 de 2022 al sostener el direccionamiento académico desde seguimiento verificable de resultados y acciones de mejoramiento. A es útil para reporte, pero privilegia control administrativo; B fortalece memoria institucional, aunque no verifica impacto en aula."}]}, {"start_q": 29, "end_q": 32, "situation": ["En la Institución Educativa Horizonte Andino, el coordinador académico recibe el informe de seguimiento a egresados: muchos ingresan a formación técnica y reportan debilidades en pensamiento estadístico y redacción argumentativa. A la vez, un aliado empresarial anuncia automatización y solicita estudiantes con competencias digitales, análisis de datos y ética en el manejo de información. La institución conserva una media técnica tradicional y planes de área centrados en contenidos memorísticos. En pruebas internas los promedios son altos; en pruebas externas recientes, el desempeño se estanca en lectura crítica y matemáticas.", "El Consejo Académico debate una actualización curricular. Algunos docentes proponen agregar una asignatura de programación; otros sugieren reforzar lectura con más tareas escritas. El coordinador revisa orientaciones del MEN sobre competencias del siglo XXI, normativa de protección de datos y enfoques metodológicos como aprendizaje basado en proyectos y evaluación formativa. Advierte que varias prácticas de aula usan aplicaciones que recolectan datos estudiantiles carentes de lineamientos institucionales, lo cual crea riesgos jurídicos. El rector solicita una propuesta sustentada con evidencias y un plan gradual, articulado al Plan de Mejoramiento y a la permanencia.", "El coordinador consulta el manual de funciones adoptado por la Resolución 003842 de 2022, que le asigna proponer y sustentar cambios curriculares ante el Consejo Académico. Revisa la Guía 31 y concluye que la decisión exige análisis sistemático, evidencias verificables y seguimiento a compromisos. Decide entre presentar ajustes menores de malla para la visita, o plantear una reforma integrada que conecte egresados, entorno productivo, innovación didáctica y cumplimiento normativo."], "aspect": "El coordinador propone y sustenta cambios curriculares ante el consejo académico, considerando el seguimiento a egresados y novedades tecnológicas, jurídicas y metodológicas que impacten el sector.", "questions": [{"num": 29, "text": "¿Cuál acción inicial fortalece mejor la sustentación de cambios curriculares ante el Consejo Académico, integrando egresados, entorno y novedades relevantes?", "options": [{"letter": "A", "text": "Implementar un levantamiento de información de egresados mediante encuestas y entrevistas, cruzándolo con resultados internos y externos, para diagnóstico curricular institucional anual."}, {"letter": "B", "text": "Implementar un análisis triangulado de egresados, tendencias tecnológicas, novedades jurídicas y evidencias de aula, para sustentar cambios ante Consejo Académico verificables documentados."}, {"letter": "C", "text": "Implementar una propuesta de asignaturas nuevas basada en herramientas digitales populares, con cronograma de implementación y solicitud de aprobación ante Consejo Académico."}], "key": "B", "justification": "La opción B se alinea con la Resolución 003842 de 2022 al priorizar la función de proponer y sustentar cambios curriculares con argumentos integrales. Asimismo, responde a la Guía 31 al estructurar un análisis sistemático, sustentado en evidencias verificables y con condiciones para seguimiento de compromisos. La opción A aporta diagnóstico por egresados y resultados, aunque deja por fuera riesgos jurídicos y lectura del entorno tecnológico; la opción C impulsa renovación, pero privilegia tendencia tecnológica sobre evidencia y pertinencia normativa."}, {"num": 30, "text": "¿Qué propuesta curricular resulta más pertinente para responder a automatización del entorno y a riesgos jurídicos por uso de aplicaciones, manteniendo coherencia metodológica?", "options": [{"letter": "A", "text": "Proponer ajustes en mallas para mejorar resultados Saber, incorporando más simulacros y tareas repetitivas, y reportar avance mensual al Consejo Académico formal."}, {"letter": "B", "text": "Proponer actualización metodológica mediante aprendizaje basado en proyectos, capacitar docentes y elaborar guías, y socializar experiencias en jornada pedagógica institucional semestral documentada."}, {"letter": "C", "text": "Proponer una modificación curricular con enfoque de ciudadanía digital y datos, integrando lineamientos legales, evaluación formativa y seguimiento a egresados pertinente gradual."}], "key": "C", "justification": "La opción C integra seguimiento a egresados, novedades tecnológicas y consideraciones jurídicas, y las traduce en modificación curricular con evaluación formativa, fortaleciendo la sustentación técnica prevista en la Resolución 003842 de 2022. Desde la Guía 31, esta alternativa favorece decisiones orientadas al mejoramiento con evidencia y metas medibles, habilitando seguimiento institucional. La opción B fortalece metodologías, pero resulta menos eficaz frente al componente jurídico y al vínculo con egresados; la opción A concentra esfuerzo en entrenamiento para pruebas y reduce pertinencia frente al entorno."}, {"num": 31, "text": "Tras la aprobación inicial, ¿qué decisión de implementación permite verificar impacto y ajustar el currículo con evidencias comparables en cada nivel?", "options": [{"letter": "A", "text": "Establecer un plan piloto con indicadores, observación de clases, análisis de productos y retroalimentación docente, para ajustar currículo trimestralmente en cada nivel."}, {"letter": "B", "text": "Establecer un sistema de certificaciones externas para docentes, con cursos virtuales y evaluación final, y presentar diplomas en acto institucional anual público."}, {"letter": "C", "text": "Establecer un comité de infraestructura tecnológica, priorizar compras y conectividad, y elaborar inventario actualizado para mejorar condiciones de innovación escolar por sedes."}], "key": "A", "justification": "La opción A operacionaliza la Guía 31 al sostener seguimiento continuo, sistemático y basado en evidencias de práctica, lo que habilita ajustes oportunos y verificables. En coherencia con la Resolución 003842 de 2022, fortalece el direccionamiento académico al conectar el cambio curricular con observación, productos y retroalimentación. La opción B mejora cualificación, aunque su relación con impacto curricular queda indirecta; la opción C mejora condiciones, pero no verifica aprendizaje ni apropiación curricular."}, {"num": 32, "text": "¿Qué forma de sustentación ante el Consejo Académico ofrece mayor solidez para aprobar cambios y asegurar seguimiento institucional en el Plan de Mejoramiento?", "options": [{"letter": "A", "text": "Sustentar la reforma curricular con testimonios de docentes innovadores, ejemplos de clase y referencias bibliográficas, buscando aprobación rápida del Consejo Académico hoy."}, {"letter": "B", "text": "Sustentar los cambios curriculares con evidencia triangulada, análisis de egresados, pertinencia normativa, metas medibles y plan de seguimiento institucional por periodos lectivos."}, {"letter": "C", "text": "Sustentar una actualización curricular mediante comparación con colegios líderes, visitas de observación y adopción de su modelo, presentando informe referencial al Consejo."}], "key": "B", "justification": "La opción B maximiza consistencia técnica y trazabilidad: integra evidencia triangulada, pertinencia normativa y metas medibles, favoreciendo aprobación informada y seguimiento, en línea con la Guía 31. A la vez, se ajusta a la Resolución 003842 de 2022 al sustentar cambios curriculares con soporte verificable ante el Consejo Académico. La opción A aporta insumos cualitativos valiosos, aunque con menor robustez probatoria; la opción C amplía referentes, pero privilegia traslación de modelos externos sobre análisis contextual y evidencia institucional."}]}, {"start_q": 33, "end_q": 36, "situation": ["En la Institución Educativa Jardines del Sur, el coordinador académico acordó con el Consejo Académico tres ajustes de aula para elevar la calidad: uso de rúbricas por competencias, tareas auténticas y retroalimentación formativa semanal. Dos meses después, los resultados del seguimiento muestran variaciones: en séptimo hay mejoras en participación, pero en noveno persisten pruebas de memoria y registros de notas con criterios poco claros. Estudiantes con PIAR reportan apoyos dispares entre docentes y las familias solicitan explicaciones por cambios abruptos de metodología.", "La Secretaría de Educación solicita evidencias del Plan de Mejoramiento y pide mostrar acciones frente a resultados externos recientes, además de un reporte sobre permanencia en jornada tarde. El rector requiere que el coordinador presente avances en la evaluación anual de desempeño y soportes de acompañamiento docente. Al revisar el manual de funciones adoptado por la Resolución 003842 de 2022, el coordinador identifica su responsabilidad de orientar el trabajo pedagógico y hacer seguimiento a los ajustes acordados. Al consultar la Guía 31, confirma que la evaluación se caracteriza por ser continua, sistemática y sustentada en evidencias, con retroalimentación y seguimiento a compromisos.", "Surge un dilema operativo: algunos docentes proponen enviar evidencias por formulario y mantener autonomía; otros piden observaciones de aula con devolución técnica; varios temen que el proceso sea percibido como control punitivo. El coordinador necesita decidir una estrategia que combine acompañamiento, análisis de evidencias de aprendizaje, retroalimentación técnica y ajustes curriculares, asegurando trazabilidad para el Consejo Académico y preservando el clima institucional en el bimestre siguiente."], "aspect": "El coordinador hace seguimiento a los ajustes propuestos en las prácticas de aula y retroalimenta al equipo docente a cargo de dichos ajustes.", "questions": [{"num": 33, "text": "¿Qué acción inicial permite hacer seguimiento efectivo a los ajustes de aula y retroalimentar al equipo docente con evidencia verificable?", "options": [{"letter": "A", "text": "Implementar un reporte digital de avance docente, mediante formularios estructurados, análisis de datos y devoluciones por área, para documentar seguimiento institucional riguroso."}, {"letter": "B", "text": "Implementar un ciclo periódico de observación de aula, mediante guías comunes, revisión de evidencias estudiantiles y retroalimentación inmediata, para consolidar ajustes acordados."}, {"letter": "C", "text": "Implementar un seminario intensivo de evaluación formativa, mediante talleres aplicados, lecturas guiadas y diseño de instrumentos, para fortalecer apropiación metodológica institucional docente."}], "key": "B", "justification": "La alternativa B prioriza seguimiento situado de la práctica, revisión de evidencias y retroalimentación inmediata, lo que fortalece trazabilidad y mejora continua. Esta lógica se ajusta al enfoque de la Guía 31 (proceso continuo, sistemático, basado en evidencia y con seguimiento a compromisos) y materializa responsabilidades funcionales del directivo docente establecidas en el manual adoptado por la Resolución 003842 de 2022 respecto a orientación y acompañamiento pedagógico. La opción A aporta control informacional, pero reduce contraste pedagógico en aula; la opción C fortalece capacidades, aunque pospone la verificación de implementación real."}, {"num": 34, "text": "¿Qué decisión de retroalimentación reduce tensiones internas y aumenta consistencia en la implementación de los ajustes por parte del equipo docente?", "options": [{"letter": "A", "text": "Establecer una mentoría entre docentes, mediante observaciones recíprocas, diarios pedagógicos breves y reuniones quincenales planificadas, para fortalecer ajustes y cultura innovadora institucional."}, {"letter": "B", "text": "Establecer un tablero público de resultados, mediante comparaciones por curso, metas numéricas y reportes frecuentes, para impulsar responsabilidad y foco académico sostenido."}, {"letter": "C", "text": "Establecer un protocolo de retroalimentación, mediante análisis de evidencias, acuerdos de mejora, acompañamiento en aula y seguimiento trimestral, para asegurar implementación consistente."}], "key": "C", "justification": "La opción C instala un mecanismo formal de retroalimentación con evidencia, acuerdos y seguimiento, aumentando consistencia y legitimidad del proceso, condición central del enfoque evaluativo descrito en la Guía 31. Además, se alinea con el marco funcional del manual adoptado por la Resolución 003842 de 2022, al convertir el liderazgo pedagógico en acompañamiento verificable y mejora institucional. La opción A es potente para aprendizaje profesional, pero tiene trazabilidad más heterogénea; la opción B puede intensificar tensiones y distorsionar la apropiación pedagógica del ajuste."}, {"num": 35, "text": "¿Qué mecanismo de verificación permite determinar el impacto de los ajustes en aprendizaje y orientar retroalimentación diferenciada por grado y área?", "options": [{"letter": "A", "text": "Aplicar una triangulación de evidencias, mediante muestras estudiantiles, rúbricas comunes y observaciones focalizadas periódicas registradas, para valorar impacto y ajustar acompañamiento docente."}, {"letter": "B", "text": "Aplicar un cal
