endario de simulacros externos, mediante bancos de ítems, análisis estadístico y metas por grado, para elevar puntajes y reportar avances."}, {"letter": "C", "text": "Aplicar una plataforma de analítica educativa, mediante capacitación docente, paneles de seguimiento y reportes automáticos institucionales, para monitorear uso de ajustes acordados."}], "key": "A", "justification": "La alternativa A ofrece evidencia directa y comparable de práctica y resultados (productos, rúbricas y observación), fortaleciendo validez del juicio y permitiendo retroalimentación pertinente; este enfoque coincide con la Guía 31, que privilegia evidencia y sistematicidad para la mejora. También armoniza con el manual adoptado por la Resolución 003842 de 2022, al sostener seguimiento y retroalimentación orientados a ajustes reales en aula. La opción B favorece rendición de puntajes, pero no explica calidad de implementación; la opción C apoya monitoreo, aunque puede centrarse en uso de herramientas más que en evidencia pedagógica."}, {"num": 36, "text": "¿Qué decisión de comunicación y cierre del ciclo protege el clima institucional y asegura continuidad del ajuste con compromisos verificables?", "options": [{"letter": "A", "text": "Presentar un informe de cumplimiento, mediante cuadros detallados de avance, actas y cronogramas mensuales, para solicitar ajustes inmediatos y respaldar requerimientos directivos."}, {"letter": "B", "text": "Presentar una retroalimentación formativa, mediante reuniones por áreas, criterios comunes y compromisos verificables trimestrales, para fortalecer confianza y asegurar ajustes en aula."}, {"letter": "C", "text": "Presentar una estrategia de reconocimiento, mediante premios, difusión de experiencias y vitrinas pedagógicas abiertas, para motivar innovación y visibilizar logros institucionales anuales."}], "key": "B", "justification": "La opción B posiciona la retroalimentación como herramienta de mejoramiento, instala criterios comunes y compromisos verificables, y preserva el clima institucional, en coherencia con la Guía 31 (evaluación basada en evidencia, retroalimentación y seguimiento a compromisos). A su vez, concreta el rol funcional del directivo docente en el manual adoptado por la Resolución 003842 de 2022, al orientar el trabajo pedagógico mediante seguimiento y retroalimentación técnica. La opción A prioriza control documental; la opción C promueve motivación, aunque aporta menor trazabilidad sobre consistencia del ajuste."}]}, {"start_q": 37, "end_q": 40, "situation": ["En la Institución Educativa Oficial Valle Azul, el coordinador académico recibe alertas por repitencia en sexto, ausentismo recurrente y conflictos en recreo. El informe del SIEE muestra promedios altos en varias áreas, pero las rúbricas evidencian baja argumentación y dificultades en resolución de problemas. En pruebas externas recientes, el establecimiento cae en lectura crítica y matemáticas; además, la jornada tarde concentra mayor deserción. Docentes reportan cuatro estudiantes con conductas disruptivas y bajo rendimiento; dos presentan procesos de restablecimiento de derechos y uno tiene apoyos definidos en PIAR. Las familias piden acciones claras porque existen sanciones dispares y tareas acumuladas que no mejoran el aprendizaje.", "El rector solicita al coordinador un plan de intervención con evidencias para el Plan de Mejoramiento, y pide soportes para evaluación anual de desempeño. La Secretaría de Educación anuncia visita de acompañamiento y solicita actas, rutas aplicadas, evidencias y reportes de seguimiento. El coordinador revisa el manual de funciones adoptado mediante la Resolución 003842 de 2022 y reconoce su responsabilidad de conocer casos académicos y disciplinares, y apoyar a docentes en su resolución. También consulta la Guía 31, que define la evaluación como proceso continuo, sistemático y basado en evidencia, con seguimiento a compromisos.", "El dilema surge cuando algunos docentes piden remitir todo a convivencia, let mode = 'sequential';
let blockOrder = [];
let currentBlockIdx = 0;
let userAnswers = {};
let correctCount = 0;
let wrongCount = 0;

function setMode(m, btn) {
  mode = m;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startQuiz() {
  blockOrder = QUIZ_DATA.map((_, i) => i);
  if (mode === 'random') blockOrder = shuffle(blockOrder);
  
  userAnswers = {};
  correctCount = 0;
  wrongCount = 0;
  currentBlockIdx = 0;
  
  document.getElementById('screen-start').classList.add('hidden');
  document.getElementById('screen-quiz').classList.remove('hidden');
  document.getElementById('app-scoreboard').classList.remove('hidden');
  document.getElementById('app-progress').classList.remove('hidden');
  
  buildNav();
  renderBlock();
  updateScoreboard();
}

function buildNav() {
  const nav = document.getElementById('q-nav');
  nav.innerHTML = '';
  let allQs = [];
  QUIZ_DATA.forEach(block => block.questions.forEach(q => allQs.push(q.num)));
  allQs.forEach(num => {
    const btn = document.createElement('button');
    btn.className = 'q-nav-btn';
    btn.textContent = num;
    btn.id = 'nav-' + num;
    btn.onclick = () => jumpToQuestion(num);
    nav.appendChild(btn);
  });
}

function jumpToQuestion(num) {
  for (let i = 0; i < blockOrder.length; i++) {
    const block = QUIZ_DATA[blockOrder[i]];
    if (block.questions.some(q => q.num === num)) {
      currentBlockIdx = i;
      renderBlock();
      const el = document.getElementById('q-' + num);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      return;
    }
  }
}

function renderBlock() {
  const block = QUIZ_DATA[blockOrder[currentBlockIdx]];
  const container = document.getElementById('quiz-content');
  
  let html = '<div class="situation-card">';
  html += '<div class="label">Situación — Preguntas ' + block.start_q + ' a ' + block.end_q + '</div>';
  if (block.aspect) {
    html += '<div class="aspect">🎯 ' + esc(block.aspect) + '</div>';
  }
  html += '<button class="sit-toggle" onclick="toggleSit(this)">▶ Leer situación</button>';
  html += '<div class="sit-body" id="sit-body">';
  block.situation.forEach(p => { html += '<p>' + esc(p) + '</p>'; });
  html += '</div></div>';
  
  block.questions.forEach(q => {
    const answered = userAnswers[q.num] !== undefined;
    const isCorrect = answered && userAnswers[q.num] === q.key;
    const cardClass = answered ? (isCorrect ? 'answered-correct' : 'answered-wrong') : '';
    
    html += '<div class="q-card ' + cardClass + '" id="q-' + q.num + '">';
    html += '<div class="q-num">Pregunta ' + q.num + ' de 46</div>';
    html += '<div class="q-text">' + esc(q.text) + '</div>';
    
    q.options.forEach(opt => {
      let optClass = 'option-btn';
      if (answered) {
        optClass += ' disabled';
        if (opt.letter === q.key) optClass += ' correct-reveal';
        else if (opt.letter === userAnswers[q.num] && opt.letter !== q.key) optClass += ' wrong-reveal';
        else optClass += ' dimmed';
      }
      html += '<button class="' + optClass + '" ' + (answered ? 'disabled' : '') + ' onclick="selectAnswer(' + q.num + ',\'' + opt.letter + '\')">';
      html += '<span class="letter">' + opt.letter + '</span>';
      html += '<span>' + esc(opt.text) + '</span>';
      html += '</button>';
    });
    
    const justClass = answered ? 'justification show' : 'justification';
    html += '<div class="' + justClass + '" id="just-' + q.num + '">';
    html += '<strong>' + (answered && isCorrect ? '✓ ¡Correcto!' : answered ? '✗ Respuesta correcta: ' + q.key : '') + '</strong> ';
    html += esc(q.justification);
    html += '</div>';
    
    html += '</div>';
  });
  
  container.innerHTML = html;
  
  // Update nav highlights
  QUIZ_DATA.forEach(b => b.questions.forEach(q => {
    const navBtn = document.getElementById('nav-' + q.num);
    if (!navBtn) return;
    navBtn.className = 'q-nav-btn';
    if (userAnswers[q.num] !== undefined) {
      navBtn.classList.add(userAnswers[q.num] === q.key ? 'nav-correct' : 'nav-wrong');
    }
  }));
  // Mark current block
  block.questions.forEach(q => {
    const navBtn = document.getElementById('nav-' + q.num);
    if (navBtn && !userAnswers[q.num]) navBtn.classList.add('current');
  });
  
  // Show/hide finish button
  const totalAnswered = Object.keys(userAnswers).length;
  document.getElementById('btn-finish').classList.toggle('hidden', totalAnswered < 46);
  
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function toggleSit(btn) {
  const body = document.getElementById('sit-body');
  body.classList.toggle('open');
  btn.textContent = body.classList.contains('open') ? '▼ Ocultar situación' : '▶ Leer situación';
}

function selectAnswer(qNum, letter) {
  if (userAnswers[qNum] !== undefined) return;
  
  const block = QUIZ_DATA[blockOrder[currentBlockIdx]];
  const q = block.questions.find(qq => qq.num === qNum);
  
  userAnswers[qNum] = letter;
  if (letter === q.key) correctCount++;
  else wrongCount++;
  
  updateScoreboard();
  renderBlock();
  
  // Scroll to justification
  setTimeout(() => {
    const el = document.getElementById('just-' + qNum);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 100);
}

function updateScoreboard() {
  const total = 46;
  const answered = correctCount + wrongCount;
  document.getElementById('sc-correct').textContent = correctCount;
  document.getElementById('sc-wrong').textContent = wrongCount;
  document.getElementById('sc-pending').textContent = total - answered;
  document.getElementById('sc-pct').textContent = answered > 0 ? Math.round(correctCount / answered * 100) : 0;
  document.getElementById('progress-fill').style.width = (answered / total * 100) + '%';
}

function prevBlock() {
  if (currentBlockIdx > 0) { currentBlockIdx--; renderBlock(); }
}

function nextBlock() {
  if (currentBlockIdx < blockOrder.length - 1) { currentBlockIdx++; renderBlock(); }
}

function showResults() {
  document.getElementById('screen-quiz').classList.add('hidden');
  const total = 46;
  const pct = Math.round(correctCount / total * 100);
  let emoji = pct >= 80 ? '🏆' : pct >= 60 ? '📈' : '📚';
  let msg = pct >= 80 ? '¡Excelente dominio!' : pct >= 60 ? 'Buen avance, refuerza los errores.' : 'Necesitas repasar más casos.';
  
  let html = '<div class="results-panel">';
  html += '<div style="font-size:2.5rem;">' + emoji + '</div>';
  html += '<div class="big-score">' + pct + '%</div>';
  html += '<div class="big-label">' + msg + '</div>';
  html += '<div class="results-bar">';
  html += '<span class="score-pill correct">✓ ' + correctCount + ' correctas</span>';
  html += '<span class="score-pill wrong">✗ ' + wrongCount + ' incorrectas</span>';
  html += '</div>';
  
  // Review wrong answers
  let wrongs = [];
  QUIZ_DATA.forEach(block => block.questions.forEach(q => {
    if (userAnswers[q.num] && userAnswers[q.num] !== q.key) {
      wrongs.push(q);
    }
  }));
  
  if (wrongs.length > 0) {
    html += '<h3 style="margin:1.5rem 0 .8rem;color:var(--navy);text-align:left;">Preguntas para repasar</h3>';
    wrongs.forEach(q => {
      html += '<div class="review-item">';
      html += '<span class="ri-num">P' + q.num + '</span> ';
      html += '<span class="ri-wrong">Tu: ' + userAnswers[q.num] + '</span> → ';
      html += '<span class="ri-correct">Correcta: ' + q.key + '</span>';
      html += '</div>';
    });
  }
  
  html += '<div style="margin-top:1.5rem;">';
  html += '<button class="btn btn-primary" onclick="restart()">Repetir simulacro</button> ';
  html += '<button class="btn btn-outline" onclick="reviewAll()">Revisar todo</button>';
  html += '</div></div>';
  
  document.getElementById('screen-results').innerHTML = html;
  document.getElementById('screen-results').classList.remove('hidden');
}

function restart() {
  document.getElementById('screen-results').classList.add('hidden');
  document.getElementById('screen-quiz').classList.add('hidden');
  document.getElementById('app-scoreboard').classList.add('hidden');
  document.getElementById('app-progress').classList.add('hidden');
  document.getElementById('screen-start').classList.remove('hidden');
}

function reviewAll() {
  document.getElementById('screen-results').classList.add('hidden');
  document.getElementById('screen-quiz').classList.remove('hidden');
  currentBlockIdx = 0;
  blockOrder = QUIZ_DATA.map((_, i) => i);
  renderBlock();
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
</script>
